name: nightly-acceptance

on:
  workflow_dispatch:
    # ...

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  acceptance:
    environment: tool
    runs-on: larger
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          use-policy-store: true
          egress-policy: audit
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-libs/go.mod

      - name: Acceptance
        uses: databrickslabs/sandbox/acceptance@acceptance/v0.4.3
        with:
          directory: go-libs
          vault_uri: ${{ secrets.VAULT_URI }}
          create_issues: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        
